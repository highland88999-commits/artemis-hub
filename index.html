<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARTEMIS • NEURAL OS</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #d4af37; }
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family: monospace; }
        
        /* Background Loop */
        #bg-video {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(0.3) contrast(1.2);
        }

        /* Holoframe Styling */
        #holo-overlay {
            position: fixed; inset: 4%; display: flex; flex-direction: column;
            border: 2px solid var(--cyan); border-radius: 12px;
            background: rgba(0, 15, 25, 0.7); backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3), inset 0 0 20px rgba(0, 242, 255, 0.1);
            z-index: 1000; transition: transform 0.5s ease;
        }

        .holo-header {
            padding: 12px 20px; background: rgba(0, 242, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--cyan); letter-spacing: 2px;
        }

        .iframe-wrapper { position: relative; flex: 1; overflow: hidden; }

        #holo-iframe {
            width: 100%; height: 100%; border: none;
            filter: saturate(1.2) brightness(1.1); /* Neon Bloom */
        }

        /* Transition Video Overlay */
        #transition-overlay {
            position: absolute; inset: 0; z-index: 2000;
            background: #000; display: none; justify-content: center; align-items: center;
        }
        #transition-video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline>
    <source src="https://raw.githubusercontent.com/highland88999-commits/artemis-hub/main/No_humans_pleas%20(1).mp4" type="video/mp4">
</video>

<div id="holo-overlay">
    <div class="holo-header">
        <span id="holo-title">NEXUS STATUS: READY</span>
        <div style="cursor:pointer; color:#ff3366; font-weight:bold;">× TERMINATE</div>
    </div>
    <div class="iframe-wrapper">
        <div id="transition-overlay">
            <video id="transition-video" loop muted playsinline>
                <source src="https://raw.githubusercontent.com/highland88999-commits/artemis-hub/main/VID_20260208225522.mp4" type="video/mp4">
            </video>
        </div>
        <iframe id="holo-iframe" src="https://YOUR-HUB-URL.onrender.com" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>
</div>

<script>
    window.addEventListener('message', (event) => {
        if (event.data.type === 'load_site') {
            const iframe = document.getElementById('holo-iframe');
            const transition = document.getElementById('transition-overlay');
            const transVideo = document.getElementById('transition-video');

            transition.style.display = 'flex';
            transVideo.play();
            
            iframe.src = event.data.url;
            document.getElementById('holo-title').textContent = "COMMUNING WITH NODE...";

            iframe.onload = () => {
                setTimeout(() => {
                    transition.style.display = 'none';
                    transVideo.pause();
                    document.getElementById('holo-title').textContent = "LINK ESTABLISHED";
                }, 800);
            };
        }
    });
</script>
</body>
</html>
