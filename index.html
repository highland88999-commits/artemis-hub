<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS • NEXUS HUB</title>
    <style>
        :root { 
            --cyan: #00f2ff; 
            --bg: #050a10; 
            --glass: rgba(0, 242, 255, 0.05); 
            --border: rgba(0, 242, 255, 0.3);
            --neon-glow: 0 0 10px rgba(0, 242, 255, 0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: transparent; /* Allows OS wallpaper to show through if iframe is transparent */
            color: var(--cyan); 
            font-family: 'Courier New', monospace; 
            margin: 0; padding: 0; 
            height: 100vh; overflow: hidden; 
            display: flex; flex-direction: column; 
            user-select: none;
        }

        /* --- BACKGROUND (Optional Internal Wallpaper) --- */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle at top, rgba(0, 242, 255, 0.1) 0%, transparent 60%);
            z-index: -1; pointer-events: none;
        }

        /* --- OMNIBOX (Search/URL) --- */
        .omnibox-container {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.0));
            z-index: 100;
            display: flex; gap: 10px; flex-direction: column;
            align-items: center;
        }

        .search-wrapper {
            position: relative; width: 100%; max-width: 600px;
            display: flex; align-items: center;
        }

        #browser-input { 
            width: 100%; 
            background: rgba(0, 10, 20, 0.8); 
            border: 1px solid var(--border); 
            padding: 15px 45px 15px 20px; 
            border-radius: 50px;
            color: #fff; font-size: 16px; font-family: inherit; letter-spacing: 1px;
            outline: none; text-align: left; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        #browser-input:focus { border-color: var(--cyan); box-shadow: var(--neon-glow); }
        
        .search-icon {
            position: absolute; right: 15px; color: var(--cyan); opacity: 0.7;
            pointer-events: none; font-size: 18px;
        }

        /* --- SWIPEABLE SECTORS --- */
        .nexus-viewport { 
            flex: 1; display: flex; 
            overflow-x: auto; 
            overflow-y: hidden;
            scroll-snap-type: x mandatory; 
            scrollbar-width: none; 
            scroll-behavior: smooth;
            padding-bottom: 20px;
        }
        .nexus-viewport::-webkit-scrollbar { display: none; }

        .sector-page { 
            min-width: 100vw; 
            height: 100%; 
            padding: 10px 20px; 
            scroll-snap-align: start; 
            display: flex; flex-direction: column; 
            overflow-y: auto; /* Allow vertical scrolling within the page */
        }

        .sector-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .sector-title { 
            font-size: 1.2rem; letter-spacing: 4px; font-weight: bold; 
            color: #fff; text-shadow: var(--neon-glow); 
        }
        .sector-count { font-size: 0.8rem; opacity: 0.6; }

        /* --- APP GRID (Mobile Responsive) --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* 2 Columns on Mobile */
            gap: 15px; 
            padding-bottom: 80px; 
        }
        
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } /* 4 on Desktop */
            .sector-page { padding: 20px 10%; }
        }

        .node { 
            background: rgba(0, 15, 25, 0.6); 
            border: 1px solid rgba(0, 242, 255, 0.15); 
            padding: 20px 10px; 
            border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 8px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backdrop-filter: blur(5px);
        }
        .node:active { transform: scale(0.96); background: rgba(0, 242, 255, 0.1); }
        .node:hover { border-color: var(--cyan); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .node-icon { font-size: 24px; margin-bottom: 5px; filter: drop-shadow(0 0 5px var(--cyan)); }
        .node-name { font-size: 12px; font-weight: bold; color: #eee; letter-spacing: 1px; }
        .node-url { font-size: 9px; color: var(--cyan); opacity: 0.5; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- NAVIGATION DOTS --- */
        .nav-footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, #000 20%, transparent);
            padding: 20px 0; display: flex; justify-content: center; align-items: center;
            gap: 12px; pointer-events: none; /* Let clicks pass through to grid behind if needed */
        }
        .dot { 
            width: 8px; height: 8px; border-radius: 50%; 
            background: rgba(255,255,255,0.2); 
            transition: 0.3s; pointer-events: auto; cursor: pointer;
        }
        .dot.active { 
            background: var(--cyan); 
            box-shadow: 0 0 10px var(--cyan); 
            transform: scale(1.5); 
        }

    </style>
</head>
<body>

<div class="omnibox-container">
    <div class="search-wrapper">
        <input type="text" id="browser-input" placeholder="SEARCH OR ENTER URL..." autocomplete="off">
        <div class="search-icon">🔍</div>
    </div>
</div>

<div class="nexus-viewport" id="viewport"></div>

<div class="nav-footer" id="dots"></div>

<script>
    // --- DATABASE ---
    const data = {
        "CORE": [
            { name: "Google", url: "google.com", icon: "🔍" },
            { name: "YouTube", url: "youtube.com", icon: "▶️" },
            { name: "ChatGPT", url: "chat.openai.com", icon: "🤖" },
            { name: "Gmail", url: "mail.google.com", icon: "📧" },
            { name: "Maps", url: "maps.google.com", icon: "🗺️" },
            { name: "Weather", url: "weather.com", icon: "☁️" }
        ],
        "SOCIAL": [
            { name: "X / Twitter", url: "x.com", icon: "❌" },
            { name: "Reddit", url: "reddit.com", icon: "👽" },
            { name: "Instagram", url: "instagram.com", icon: "📸" },
            { name: "TikTok", url: "tiktok.com", icon: "🎵" },
            { name: "LinkedIn", url: "linkedin.com", icon: "💼" },
            { name: "Discord", url: "discord.com/app", icon: "🎮" }
        ],
        "MEDIA": [
            { name: "Netflix", url: "netflix.com", icon: "🍿" },
            { name: "Spotify", url: "open.spotify.com", icon: "🎧" },
            { name: "Twitch", url: "twitch.tv", icon: "👾" },
            { name: "Hulu", url: "hulu.com", icon: "📺" },
            { name: "Apple Music", url: "music.apple.com", icon: "🎵" },
            { name: "SoundCloud", url: "soundcloud.com", icon: "☁️" }
        ],
        "DEV / TECH": [
            { name: "GitHub", url: "github.com", icon: "🐙" },
            { name: "StackOverflow", url: "stackoverflow.com", icon: "📚" },
            { name: "HuggingFace", url: "huggingface.co", icon: "🤗" },
            { name: "Vercel", url: "vercel.com", icon: "▲" },
            { name: "Figma", url: "figma.com", icon: "🎨" },
            { name: "Replit", url: "replit.com", icon: "💻" }
        ],
        "FINANCE": [
            { name: "TradingView", url: "tradingview.com", icon: "📈" },
            { name: "CoinMarketCap", url: "coinmarketcap.com", icon: "🪙" },
            { name: "Binance", url: "binance.com", icon: "💰" },
            { name: "Yahoo Finance", url: "finance.yahoo.com", icon: "📰" }
        ]
    };

    const viewport = document.getElementById('viewport');
    const dotsContainer = document.getElementById('dots');

    // --- RENDER UI ---
    Object.keys(data).forEach((sector, index) => {
        // Create Page
        const page = document.createElement('div');
        page.className = 'sector-page';
        
        // Header
        const header = document.createElement('div');
        header.className = 'sector-header';
        header.innerHTML = `<span class="sector-title">${sector}</span><span class="sector-count">${data[sector].length} NODES</span>`;
        page.appendChild(header);

        // Grid
        const grid = document.createElement('div');
        grid.className = 'grid';
        
        data[sector].forEach(site => {
            const node = document.createElement('div');
            node.className = 'node';
            node.innerHTML = `
                <div class="node-icon">${site.icon}</div>
                <div class="node-name">${site.name}</div>
                <div class="node-url">${site.url}</div>
            `;
            // CLICK HANDLER: Sends signal to Parent OS to open new frame
            node.onclick = () => launch(site.url, site.name);
            grid.appendChild(node);
        });
        
        page.appendChild(grid);
        viewport.appendChild(page);

        // Create Dot
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => {
            viewport.scrollTo({ left: window.innerWidth * index, behavior: 'smooth' });
        };
        dotsContainer.appendChild(dot);
    });

    // --- INPUT HANDLER (OMNIBOX) ---
    const input = document.getElementById('browser-input');
    
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            let val = input.value.trim();
            if(!val) return;

            // Simple Heuristic: Is it a URL or a Search?
            // If it has a dot and no spaces, assume URL. Otherwise, Search.
            if (val.includes('.') && !val.includes(' ')) {
                if (!val.startsWith('http')) val = 'https://' + val;
                launch(val, val);
            } else {
                // Default to Google Search
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
                launch(searchUrl, val.toUpperCase());
            }
            input.value = '';
            input.blur(); // Close keyboard on mobile
        }
    });

    // --- LAUNCHER PROTOCOL ---
    function launch(url, name) {
        let target = url;
        if (!target.startsWith('http')) target = 'https://' + target;

        // Message the Parent OS (Artemis Desktop)
        // This triggers the 'spawnFrame' function in the main OS code
        window.parent.postMessage({ 
            type: 'spawn_frame', // Must match listener in parent
            url: target, 
            name: name 
        }, '*');
    }

    // --- SCROLL TRACKING (UPDATE DOTS) ---
    viewport.addEventListener('scroll', () => {
        const scrollLeft = viewport.scrollLeft;
        const width = window.innerWidth;
        const index = Math.round(scrollLeft / width);
        
        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === index);
        });
    });

</script>
</body>
</html>
