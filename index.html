<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTEMIS • HUB</title>
    <style>
        :root { --cyan: #00f2ff; --bg: #000; }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--cyan); 
            font-family: 'Courier New', monospace; 
            margin: 0; padding: 20px; overflow-x: hidden;
        }
        
        .search-wrap { 
            position: sticky; top: 0; background: #000; 
            padding: 15px 0; z-index: 10; 
            border-bottom: 1px solid rgba(0, 242, 255, 0.4); 
        }
        #browser-input {
            width: 100%; background: rgba(0, 242, 255, 0.05); 
            border: 1px solid var(--cyan); padding: 15px; 
            color: var(--cyan); font-size: 1.1rem; outline: none;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            transition: 0.3s;
        }
        #browser-input:focus { box-shadow: 0 0 25px var(--cyan); background: rgba(0,242,255,0.1); }

        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; margin-top: 20px; 
        }
        .node {
            background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 15px; text-align: center; cursor: pointer; 
            transition: 0.3s ease; position: relative;
        }
        .node:hover { 
            background: var(--cyan); color: #000; 
            box-shadow: 0 0 20px var(--cyan); transform: translateY(-2px); 
        }
        .node span { display: block; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .node small { font-size: 0.55rem; opacity: 0.6; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="search-wrap">
    <input type="text" id="browser-input" placeholder="ENTER TARGET DOMAIN OR QUERY ARCHIVES..." autocomplete="off">
</div>

<div id="node-grid" class="grid"></div>

<script>
    const PROXY = "https://artemis-proxy.onrender.com/";
    
    const sites = [
        { name: "Wikipedia", url: "https://en.wikipedia.org" },
        { name: "YouTube", url: "https://www.youtube.com" },
        { name: "GitHub", url: "https://github.com" },
        { name: "Windy", url: "https://www.windy.com" },
        { name: "TradingView", url: "https://www.tradingview.com" },
        { name: "NASA", url: "https://www.nasa.gov" },
        { name: "Reddit", url: "https://www.reddit.com" },
        { name: "DuckDuckGo", url: "https://duckduckgo.com" },
        { name: "Archive.org", url: "https://archive.org" },
        { name: "WolframAlpha", url: "https://www.wolframalpha.com" },
        { name: "DevDocs", url: "https://devdocs.io" },
        { name: "CodePen", url: "https://codepen.io" },
        { name: "Hacker News", url: "https://news.ycombinator.com" },
        { name: "VirusTotal", url: "https://www.virustotal.com" },
        { name: "DeepL", url: "https://www.deepl.com" },
        { name: "ArXiv", url: "https://arxiv.org" },
        { name: "Pinterest", url: "https://www.pinterest.com" },
        { name: "StackOverflow", url: "https://stackoverflow.com" },
        { name: "Figma", url: "https://www.figma.com" },
        { name: "Canva", url: "https://www.canva.com" }
        // (Add more from previous list as desired)
    ];

    function transmit(url, name = "NODE") {
        let target = url.startsWith('http') ? url : `https://${url}`;
        window.parent.postMessage({ 
            type: 'load_site', 
            url: PROXY + target,
            name: name.toUpperCase()
        }, '*');
    }

    const grid = document.getElementById('node-grid');
    const input = document.getElementById('browser-input');

    function render(filter = "") {
        grid.innerHTML = "";
        sites.filter(s => s.name.toLowerCase().includes(filter.toLowerCase())).forEach(site => {
            const div = document.createElement('div');
            div.className = 'node';
            div.innerHTML = `<span>${site.name}</span><small>${site.url.replace('https://','')}</small>`;
            div.onclick = () => transmit(site.url, site.name);
            grid.appendChild(div);
        });
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value;
            if (val.includes('.') && !val.includes(' ')) transmit(val, val);
            else transmit(`https://duckduckgo.com/?q=${encodeURIComponent(val)}`, "SEARCH");
        }
    });

    input.addEventListener('input', (e) => render(e.target.value));
    render();
</script>
</body>
</html>
