<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS • APEX HERITAGE</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00f2ff">
    <style>
        /* --- CORE VARIABLES --- */
        :root { 
            --accent: #00f2ff; 
            --accent-glow: rgba(0, 242, 255, 0.5);
            --bg-glass: rgba(5, 10, 15, 0.65); 
            --border-glass: rgba(255, 255, 255, 0.15);
            --bloom: 0 0 20px var(--accent-glow);
            --font-main: 'Courier New', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; 
            background: #000; font-family: var(--font-main); color: var(--accent); 
            transition: all 0.5s ease; user-select: none;
        }

        /* --- BACKGROUND ENGINE --- */
        #apex-background-container { position: fixed; inset: 0; z-index: -10; background: #000; }
        #image-bg, #video-bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transition: opacity 1s ease-in-out;
            filter: brightness(0.7) contrast(1.1);
        }
        #bg-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -5; pointer-events: none;
        }

        /* --- HOLOGRAPHIC SCANLINES --- */
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            background: linear-gradient(rgba(255,255,255,0.015) 50%, transparent 50%);
            background-size: 100% 4px; opacity: 0.8;
        }

        /* --- BOOT SCREEN --- */
        #olympus-boot-screen {
            position: fixed; inset: 0; background: #050505; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.5s ease-in-out, backdrop-filter 1.5s;
        }
        #boot-video { width: 320px; margin-bottom: 40px; filter: drop-shadow(var(--bloom)); }
        .loader-container { width: 250px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        #loader-progress { width: 0%; height: 100%; background: var(--accent); box-shadow: var(--bloom); transition: width 2.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* --- SYSTEM HEADER --- */
        #system-header {
            position: fixed; top: 0; width: 100%; padding: 15px 30px; 
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); 
            z-index: 100; backdrop-filter: blur(5px);
        }
        .meta-row { display: flex; gap: 30px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-shadow: var(--bloom); }
        .meta-item span { color: #fff; font-weight: bold; }
        .header-search { width: 300px; position: relative; }
        .header-search input {
            width: 100%; padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border-glass);
            background: rgba(0, 0, 0, 0.5); color: #fff; outline: none; font-family: inherit; font-size: 11px;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .header-search input:focus { border-color: var(--accent); box-shadow: var(--bloom); }

        /* --- RIGHT HUD DASHBOARD --- */
        #right-hud {
            position: fixed; right: 20px; top: 80px; width: 280px;
            display: flex; flex-direction: column; gap: 15px; z-index: 90;
        }
        .hud-panel {
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 20px; backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* Control Center */
        .status-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 15px; color: #fff;}
        .glow-text { color: var(--accent); text-shadow: var(--bloom); font-weight: bold; letter-spacing: 1px; }
        .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .mode-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: var(--accent);
            padding: 10px 0; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1.1rem;
        }
        .mode-btn:hover { background: var(--accent); color: #000; box-shadow: var(--bloom); transform: translateY(-2px); }
        .stat-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 5px; overflow: hidden; }
        .fill { height: 100%; background: var(--accent); transition: width 0.5s ease; box-shadow: var(--bloom); }

        /* Storage */
        .storage-stats { display: flex; justify-content: space-between; margin-top: 10px; color: #fff;}
        .stat small { font-size: 9px; opacity: 0.6; }
        .stat p { font-size: 13px; margin: 2px 0 0; font-weight: bold; }

        /* --- APP GRID DESKTOP --- */
        #desktop-app-grid {
            position: absolute; top: 100px; left: 40px; width: calc(100% - 360px);
            display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 30px;
            padding: 20px; align-content: start; z-index: 50;
        }
        .app-icon {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-icon:hover { transform: translateY(-5px) scale(1.05); }
        .icon-box {
            width: 65px; height: 65px; border: 1px solid var(--border-glass); border-radius: 18px;
            display: flex; justify-content: center; align-items: center; font-size: 28px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); margin-bottom: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .app-icon:hover .icon-box { border-color: var(--accent); box-shadow: var(--bloom); }
        .app-label { font-size: 11px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); letter-spacing: 0.5px; text-align: center;}

        /* --- HOLOFRAMES (WINDOWS) --- */
        #desktop-manager { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
        .holoframe {
            position: absolute; top: 15%; left: 15%; width: 900px; height: 600px; 
            border: 1px solid var(--border-glass); border-radius: 12px;
            background: var(--bg-glass); backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), var(--bloom); 
            pointer-events: auto; display: flex; flex-direction: column;
            transition: opacity 0.2s, transform 0.2s, border-color 0.3s;
            resize: both; overflow: hidden; min-width: 300px; min-height: 200px;
        }
        .holoframe:focus-within { border-color: var(--accent); }
        
        .holo-header {
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-glass); cursor: move; 
            background: rgba(0,0,0,0.4);
        }
        .window-title { color: #fff; font-weight: bold; font-size: 12px; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .internal-address-bar { 
            background: rgba(255,255,255,0.05); border: 1px solid transparent; 
            color: #fff; font-family: var(--font-main); font-size: 10px;
            padding: 4px 10px; width: 300px; border-radius: 6px; outline: none; transition: 0.3s;
        }
        .internal-address-bar:focus { border-color: var(--accent); background: rgba(0,0,0,0.8); }
        .action-btns { display: flex; gap: 12px; align-items: center; }
        .win-btn { 
            width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 8px; font-weight: bold;
            opacity: 0.8; transition: 0.2s; color: transparent;
        }
        .win-btn:hover { opacity: 1; color: #000; }
        .btn-close { background: #ff5f56; }
        .btn-min { background: #ffbd2e; }
        .btn-max { background: #27c93f; }
        
        .iframe-wrapper { flex: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        /* Invisible shield to prevent iframe from stealing mouse during drag */
        .drag-shield { position: absolute; inset: 0; z-index: 10; display: none; }

        .holoframe.maximized {
            top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important;
            border-radius: 0; resize: none; transform: none !important; border: none;
        }

        /* --- GLOBAL COMMAND PALETTE (CMD+K) --- */
        #command-palette {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: flex-start; padding-top: 15vh; z-index: 10000;
        }
        .cmd-container {
            width: 100%; max-width: 650px; background: var(--bg-glass);
            border: 1px solid var(--accent); border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), var(--bloom); overflow: hidden;
            transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #command-palette.active .cmd-container { transform: translateY(0); opacity: 1; }
        .cmd-input-wrapper { display: flex; align-items: center; padding: 20px 25px; border-bottom: 1px solid var(--border-glass); }
        .cmd-input-wrapper span { font-size: 20px; color: var(--accent); }
        #cmd-input {
            width: 100%; background: transparent; border: none; outline: none;
            color: #fff; font-size: 1.5rem; margin-left: 15px; font-family: var(--font-main);
        }
        #cmd-results { padding: 10px; max-height: 300px; overflow-y: auto; color: #fff; }
        .cmd-item { padding: 12px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s;}
        .cmd-item:hover, .cmd-item.selected { background: var(--accent); color: #000; font-weight: bold; }

        /* --- BOTTOM DOCK --- */
        .bottom-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; padding: 12px 25px;
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            border-radius: 30px; backdrop-filter: blur(20px); z-index: 150;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center;
        }
        .dock-app {
            width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.5); cursor: pointer; transition: 0.3s; font-size: 20px; border: 1px solid transparent;
        }
        .dock-app:hover { transform: translateY(-8px) scale(1.1); border-color: var(--accent); box-shadow: var(--bloom); }
        .dock-divider { width: 1px; height: 30px; background: var(--border-glass); margin: 0 5px; }
        .minimized-indicator { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; position: absolute; bottom: -8px; }

    </style>
</head>
<body>

    <!-- Background Engine -->
    <div id="apex-background-container">
        <div id="image-bg"></div>
        <video id="video-bg" autoplay loop muted playsinline></video>
        <div id="bg-overlay"></div>
    </div>

    <!-- Boot Sequence -->
    <div id="olympus-boot-screen">
        <video id="boot-video" autoplay loop muted playsinline>
            <source src="https://files.catbox.moe/5xh10y.mp4" type="video/mp4">
        </video>
        <div class="loader-container">
            <div id="loader-progress"></div>
        </div>
    </div>

    <!-- Global Command Palette -->
    <div id="command-palette" onclick="if(event.target === this) toggleCommandPalette()">
        <div class="cmd-container" onclick="event.stopPropagation()">
            <div class="cmd-input-wrapper">
                <span>⚡</span>
                <input type="text" id="cmd-input" placeholder="Search apps, files, or web..." autocomplete="off">
            </div>
            <div id="cmd-results"></div>
        </div>
    </div>

    <!-- System Header -->
    <header id="system-header">
        <div class="meta-row">
            <div class="meta-item">ARCHIVE: <span id="cur-date">--/--/--</span></div>
            <div class="meta-item">CHRONO: <span id="cur-time">00:00:00</span></div>
            <div class="meta-item">STATUS: <span id="cur-traffic">APEX ACTIVE</span></div>
        </div>
        <div class="header-search">
            <form onsubmit="event.preventDefault(); toggleCommandPalette();">
                <input type="text" placeholder="Press Cmd+K to Search..." readonly onclick="toggleCommandPalette()">
            </form>
        </div>
    </header>

    <!-- App Grid (Desktop) -->
    <div id="desktop-app-grid">
        <!-- Apps injected via JS -->
    </div>

    <!-- Right HUD Dashboard -->
    <div id="right-hud">
        
        <!-- Control Center -->
        <div class="hud-panel">
            <div class="status-row">
                <span>ENVIRONMENT</span>
                <span id="active-mode-display" class="glow-text">ARTEMIS</span>
            </div>
            <div class="mode-grid">
                <button class="mode-btn" onclick="switchMode('ARTEMIS')">Ω</button>
                <button class="mode-btn" onclick="switchMode('APPLE')"></button>
                <button class="mode-btn" onclick="switchMode('LINUX')">🐧</button>
                <button class="mode-btn" onclick="switchMode('MICROSOFT')">⊞</button>
            </div>
            <div>
                <div class="stat-bar"><div class="fill" style="width: 42%;"></div></div>
                <div style="font-size: 9px; color: #aaa; text-align: right;">NEURAL LOAD: 42%</div>
            </div>
        </div>

        <!-- Storage Dashboard -->
        <div class="hud-panel">
            <div class="status-row">
                <span class="glow-text">APEX VIRTUAL STORAGE</span>
                <span>98%</span>
            </div>
            <div class="stat-bar" style="height: 8px;">
                <div style="display:flex; height:100%;">
                    <div style="width: 2%; background: #ff3366;"></div>
                    <div style="width: 98%; background: var(--accent); box-shadow: var(--bloom);"></div>
                </div>
            </div>
            <div class="storage-stats">
                <div class="stat"><small>LOCAL DEVICE</small><p>12 MB</p></div>
                <div class="stat" style="text-align: right;"><small>CLOUD NODE</small><p id="total-saved">42.5 GB</p></div>
            </div>
        </div>

    </div>

    <!-- Desktop Window Manager -->
    <div id="desktop-manager"></div>

    <!-- Bottom Dock -->
    <div class="bottom-dock" id="bottom-dock">
        <div class="dock-app" onclick="spawnFrame('https://artemis-hub.vercel.app/', 'NEXUS HUB', '🧬')" title="NEXUS HUB">🧬</div>
        <div class="dock-app" onclick="spawnFrame('https://architect-artemis.vercel.app/', 'ARCHITECT', '📐')" title="ARCHITECT">📐</div>
        <div class="dock-divider"></div>
        <!-- Minimized apps inject here -->
        <div id="minimized-container" style="display:flex; gap:15px;"></div>
    </div>

<script>
    // --- CORE CONFIGURATION ---
    const systems = {
        ARTEMIS: { color: "#00f2ff", font: "'Courier New', monospace", bg: "https://cdn.pixabay.com/video/2023/10/20/185834-876615024_tiny.mp4" },
        APPLE: { color: "#ffffff", font: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif", bg: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop" },
        LINUX: { color: "#39ff14", font: "'Fira Code', 'JetBrains Mono', monospace", bg: "https://cdn.pixabay.com/video/2021/08/20/85732-590457611_tiny.mp4" },
        MICROSOFT: { color: "#00a4ef", font: "'Segoe UI', sans-serif", bg: "https://images.unsplash.com/photo-1635326445090-67f139618175?q=80&w=2070&auto=format&fit=crop" }
    };

    const apps = [
        { name: "R.E.M.", url: "https://rem-psi-mauve.vercel.app/", icon: "👁️" },
        { name: "Aetheris", url: "https://aetheris-business-model.vercel.app/", icon: "🔱" },
        { name: "Tracker", url: "https://olympus-aetheris.vercel.app/", icon: "🛰️" },
        { name: "Hoodies", url: "https://olympus-lac.vercel.app/", icon: "👕" },
        { name: "Nexus", url: "https://nexus-symbiote.onrender.com/", icon: "🧬" },
        { name: "Architect", url: "https://architect-artemis.vercel.app/", icon: "📐" },
        { name: "Starblood", url: "https://starblood.vercel.app/", icon: "🩸" },
        { name: "Titan Fall", url: "https://mega-city-liard.vercel.app/", icon: "🤖" },
        { name: "Finances", url: "https://olympian-finances.vercel.app/", icon: "⚖️" },
        { name: "Gully", url: "https://grief-gully.vercel.app/", icon: "💀" }
    ];

    let threads = {}; // Store open windows by ID
    let currentMode = localStorage.getItem('artemis-mode') || 'ARTEMIS';
    let highestZ = 200;

    // --- INITIALIZATION ---
    window.addEventListener('load', () => {
        const progress = document.getElementById('loader-progress');
        const bootScreen = document.getElementById('olympus-boot-screen');

        setTimeout(() => progress.style.width = '100%', 100);
        setTimeout(() => {
            bootScreen.style.opacity = '0';
            setTimeout(() => {
                bootScreen.style.display = 'none';
                initOS();
            }, 1500);
        }, 2500);
    });

    function initOS() {
        switchMode(currentMode);
        renderDesktopApps();
        
        // Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('cur-date').innerText = now.toLocaleDateString();
            document.getElementById('cur-time').innerText = now.toLocaleTimeString();
        }, 1000);

        // Command Palette Listener
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                toggleCommandPalette();
            }
        });
    }

    // --- ECOSYSTEM SWITCHER ---
    function switchMode(modeName) {
        const config = systems[modeName];
        if (!config) return;

        document.documentElement.style.setProperty('--accent', config.color);
        document.documentElement.style.setProperty('--accent-glow', config.color + '80'); // 50% opacity
        document.documentElement.style.setProperty('--font-main', config.font);
        
        document.getElementById('active-mode-display').innerText = modeName;
        updateOSBackground(config.bg);
        
        localStorage.setItem('artemis-mode', modeName);
        currentMode = modeName;
    }

    function updateOSBackground(fileUrl) {
        const videoEl = document.getElementById('video-bg');
        const imageEl = document.getElementById('image-bg');
        const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(fileUrl);

        if (isVideo) {
            imageEl.style.opacity = '0';
            videoEl.src = fileUrl;
            videoEl.style.opacity = '1';
        } else {
            videoEl.style.opacity = '0';
            imageEl.style.backgroundImage = `url(${fileUrl})`;
            imageEl.style.opacity = '1';
        }
    }

    // --- DESKTOP RENDERER ---
    function renderDesktopApps() {
        const grid = document.getElementById('desktop-app-grid');
        grid.innerHTML = '';
        apps.forEach(app => {
            const el = document.createElement('div');
            el.className = 'app-icon';
            el.innerHTML = `
                <div class="icon-box">${app.icon}</div>
                <div class="app-label">${app.name}</div>
            `;
            el.onclick = () => spawnFrame(app.url, app.name, app.icon);
            grid.appendChild(el);
        });
    }

    // --- WINDOW MANAGER (HOLOFRAMES) ---
    function spawnFrame(url, name, icon) {
        const id = 'win-' + Date.now();
        let finalUrl = url;
        if (url.includes('google.com/search') && !url.includes('igu=1')) finalUrl += '&igu=1';

        // Cascade positions slightly
        const offset = (Object.keys(threads).length % 5) * 30;
        
        const markup = `
            <div class="holoframe" id="${id}" style="top: ${100 + offset}px; left: ${100 + offset}px;" onmousedown="focusWindow('${id}')">
                <div class="holo-header" id="header-${id}">
                    <div class="action-btns">
                        <button class="win-btn btn-close" onclick="closeWindow('${id}')">x</button>
                        <button class="win-btn btn-min" onclick="minimizeWindow('${id}')">-</button>
                        <button class="win-btn btn-max" onclick="toggleMaximize('${id}')">+</button>
                    </div>
                    <div class="window-title">${icon} ${name}</div>
                    <input type="text" class="internal-address-bar" id="addr-${id}" value="${url}" onkeypress="if(event.key==='Enter') navigateInternal('${id}')">
                </div>
                <div class="iframe-wrapper">
                    <div class="drag-shield" id="shield-${id}"></div>
                    <iframe id="iframe-${id}" src="${finalUrl}"></iframe>
                </div>
            </div>`;
        
        document.getElementById('desktop-manager').insertAdjacentHTML('beforeend', markup);
        threads[id] = { name, icon };
        
        makeDraggable(id);
        focusWindow(id);
        
        // Hide command palette if open
        const cmd = document.getElementById('command-palette');
        if(cmd.classList.contains('active')) toggleCommandPalette();
    }

    function focusWindow(id) {
        const el = document.getElementById(id);
        if (el) {
            highestZ++;
            el.style.zIndex = highestZ;
        }
    }

    function toggleMaximize(id) {
        const el = document.getElementById(id);
        el.classList.toggle('maximized');
    }

    function closeWindow(id) {
        document.getElementById(id)?.remove();
        delete threads[id];
        updateDock();
    }

    function minimizeWindow(id) {
        document.getElementById(id).style.display = 'none';
        threads[id].minimized = true;
        updateDock();
    }

    function restoreWindow(id) {
        const el = document.getElementById(id);
        el.style.display = 'flex';
        threads[id].minimized = false;
        focusWindow(id);
        updateDock();
    }

    function updateDock() {
        const container = document.getElementById('minimized-container');
        container.innerHTML = '';
        Object.keys(threads).forEach(id => {
            if (threads[id].minimized) {
                const btn = document.createElement('div');
                btn.className = 'dock-app';
                btn.title = threads[id].name;
                btn.innerHTML = `${threads[id].icon} <div class="minimized-indicator"></div>`;
                btn.onclick = () => restoreWindow(id);
                container.appendChild(btn);
            }
        });
    }

    function navigateInternal(id) {
        const input = document.getElementById(`addr-${id}`);
        const iframe = document.getElementById(`iframe-${id}`);
        let url = input.value.trim();
        if (!url.startsWith('http')) url = 'https://' + url;
        iframe.src = url;
    }

    // Advanced Dragging Logic with iframe fix
    function makeDraggable(id) {
        const el = document.getElementById(id);
        const header = document.getElementById(`header-${id}`);
        const shield = document.getElementById(`shield-${id}`);
        
        let isDragging = false, startX, startY, initialLeft, initialTop;

        header.onmousedown = (e) => {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            if(el.classList.contains('maximized')) return;
            
            isDragging = true;
            shield.style.display = 'block'; // Block iframe interactions
            
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = el.offsetLeft;
            initialTop = el.offsetTop;
        };

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            el.style.left = `${initialLeft + dx}px`;
            el.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                shield.style.display = 'none'; // Restore iframe interactions
            }
        });
    }

    // --- COMMAND PALETTE ---
    function toggleCommandPalette() {
        const palette = document.getElementById('command-palette');
        const input = document.getElementById('cmd-input');
        
        if (palette.classList.contains('active')) {
            palette.classList.remove('active');
            setTimeout(() => palette.style.display = 'none', 300);
        } else {
            palette.style.display = 'flex';
            // Slight delay for display block to register before CSS transition
            requestAnimationFrame(() => {
                palette.classList.add('active');
                input.value = '';
                input.focus();
                renderCmdResults('');
            });
        }
    }

    document.getElementById('cmd-input').addEventListener('input', (e) => {
        renderCmdResults(e.target.value.toLowerCase());
    });

    document.getElementById('cmd-input').addEventListener('keydown', (e) => {
        if(e.key === 'Enter') {
            const query = e.target.value.trim();
            if(query) {
                spawnFrame(`https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1`, `Search: ${query}`, '🔍');
            }
        }
    });

    function renderCmdResults(query) {
        const container = document.getElementById('cmd-results');
        container.innerHTML = '';
        
        const filtered = apps.filter(app => app.name.toLowerCase().includes(query));
        
        if(filtered.length === 0 && query !== '') {
            container.innerHTML = `<div class="cmd-item" style="color: #aaa;">Press Enter to search web for "${query}"</div>`;
            return;
        }

        filtered.forEach(app => {
            const div = document.createElement('div');
            div.className = 'cmd-item';
            div.innerHTML = `<span>${app.icon}</span> <span>${app.name}</span> <span style="font-size:10px; opacity:0.5; margin-left:auto;">App</span>`;
            div.onclick = () => spawnFrame(app.url, app.name, app.icon);
            container.appendChild(div);
        });
    }

</script>
</body>
</html>
