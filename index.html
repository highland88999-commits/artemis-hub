<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS • APEX HERITAGE</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00f2ff">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --accent: #00f2ff; 
            --accent-glow: rgba(0, 242, 255, 0.5);
            --bg-glass: rgba(5, 10, 15, 0.65); 
            --border-glass: rgba(255, 255, 255, 0.15);
            --bloom: 0 0 20px var(--accent-glow);
            --font-main: 'Courier New', monospace;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; 
            background: #000; font-family: var(--font-main); color: var(--accent); 
            user-select: none; transition: background 0.5s ease;
        }

        /* --- BACKGROUNDS & FX --- */
        #apex-background-container { position: fixed; inset: 0; z-index: -10; background: #000; }
        #image-bg, #video-bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transition: opacity 1s ease; filter: brightness(0.6) contrast(1.1);
        }
        #bg-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -5; pointer-events: none;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            background: linear-gradient(rgba(255,255,255,0.015) 50%, transparent 50%);
            background-size: 100% 4px; opacity: 0.8;
        }

        /* --- SCREENS --- */
        #boot-screen, #auth-screen {
            position: fixed; inset: 0; background: #050505; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease, visibility 1s;
        }
        #boot-video { width: 320px; margin-bottom: 40px; filter: drop-shadow(var(--bloom)); }
        .loader-container { width: 250px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        #loader-progress { width: 0%; height: 100%; background: var(--accent); box-shadow: var(--bloom); transition: width 2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* AUTH GATEWAY */
        .auth-panel {
            background: var(--bg-glass); border: 1px solid var(--accent); border-radius: 16px;
            padding: 40px; width: 100%; max-width: 400px; backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), var(--bloom); text-align: center;
        }
        .auth-panel h2 { color: #fff; margin-bottom: 20px; letter-spacing: 2px; }
        .auth-input {
            width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-glass);
            background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; outline: none; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--accent); box-shadow: var(--bloom); }
        .auth-btn {
            width: 100%; padding: 12px; background: var(--accent); color: #000; font-weight: bold; font-family: inherit;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-size: 14px;
        }
        .auth-btn:hover { box-shadow: var(--bloom); transform: scale(1.02); }
        .auth-btn-ghost { background: transparent; border: 1px solid var(--border-glass); color: #fff; }
        .auth-btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        /* --- OS HEADER --- */
        #system-header {
            position: fixed; top: 0; width: 100%; padding: 15px 30px; 
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); 
            z-index: 100; backdrop-filter: blur(5px);
        }
        .meta-row { display: flex; gap: 30px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-shadow: var(--bloom); }
        .meta-item span { color: #fff; font-weight: bold; transition: color 0.3s; }
        
        /* User Profile / Search */
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .header-search input {
            width: 250px; padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border-glass);
            background: rgba(0,0,0,0.5); color: #fff; outline: none; font-size: 11px; backdrop-filter: blur(10px); cursor: pointer;
        }
        #auth-status-btn {
            padding: 6px 15px; border-radius: 15px; border: 1px solid var(--accent); background: rgba(0,242,255,0.1);
            color: var(--accent); cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.3s;
        }
        #auth-status-btn:hover { background: var(--accent); color: #000; box-shadow: var(--bloom); }

        /* --- DESKTOP GRID --- */
        #desktop-app-grid {
            position: absolute; top: 100px; left: 40px; width: calc(100% - 360px);
            display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 30px; z-index: 50;
        }
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .app-icon:hover { transform: translateY(-5px) scale(1.05); }
        .icon-box {
            width: 65px; height: 65px; border: 1px solid var(--border-glass); border-radius: 18px;
            display: flex; justify-content: center; align-items: center; font-size: 28px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); margin-bottom: 8px; transition: 0.3s;
        }
        .app-icon:hover .icon-box { border-color: var(--accent); box-shadow: var(--bloom); }
        .app-label { font-size: 11px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* --- RIGHT HUD --- */
        #right-hud { position: fixed; right: 20px; top: 80px; width: 280px; display: flex; flex-direction: column; gap: 15px; z-index: 90; }
        .hud-panel { background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 12px; padding: 20px; backdrop-filter: blur(20px); }
        
        .status-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 15px; color: #fff; text-transform: uppercase;}
        .glow-text { color: var(--accent); text-shadow: var(--bloom); font-weight: bold; }
        .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .mode-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: var(--accent); padding: 8px 0; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s;}
        .mode-btn:hover { background: var(--accent); color: #000; box-shadow: var(--bloom); }
        
        /* Bookmarks List */
        .bookmark-list { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .bookmark-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: rgba(0,0,0,0.4); border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;}
        .bookmark-item:hover { border-color: var(--accent); }
        .bookmark-item span { font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- WINDOW MANAGER --- */
        #desktop-manager { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
        .holoframe {
            position: absolute; border: 1px solid var(--border-glass); border-radius: 12px;
            background: var(--bg-glass); backdrop-filter: blur(25px); box-shadow: 0 20px 50px rgba(0,0,0,0.7), var(--bloom); 
            pointer-events: auto; display: flex; flex-direction: column; transition: border-color 0.3s;
            resize: both; overflow: hidden; min-width: 300px; min-height: 200px;
        }
        .holoframe:focus-within { border-color: var(--accent); }
        .holo-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); cursor: move; background: rgba(0,0,0,0.4); }
        .window-title { color: #fff; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 8px;}
        .internal-address-bar { background: rgba(255,255,255,0.05); border: 1px solid transparent; color: #fff; font-family: inherit; font-size: 10px; padding: 4px 10px; width: 250px; border-radius: 6px; outline: none; transition: 0.3s; }
        .internal-address-bar:focus { border-color: var(--accent); }
        
        .action-btns { display: flex; gap: 10px; align-items: center; }
        .win-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 8px; font-weight: bold; opacity: 0.8; color: transparent; transition: 0.2s; }
        .win-btn:hover { opacity: 1; color: #000; }
        .btn-close { background: #ff5f56; }
        .btn-min { background: #ffbd2e; }
        .btn-max { background: #27c93f; }
        .btn-star { background: transparent; color: var(--accent); border: 1px solid var(--accent); opacity: 1; font-size: 9px;}
        .btn-star:hover { background: var(--accent); color: #000; }
        
        .iframe-wrapper { flex: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .drag-shield { position: absolute; inset: 0; z-index: 10; display: none; }
        .holoframe.maximized { top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; border-radius: 0; resize: none; border: none; }

        /* --- BOTTOM DOCK --- */
        .bottom-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; padding: 10px 25px;
            background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 30px; backdrop-filter: blur(20px); z-index: 150; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dock-app { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); cursor: pointer; font-size: 20px; border: 1px solid transparent; transition: 0.3s; position: relative;}
        .dock-app:hover { transform: translateY(-8px) scale(1.1); border-color: var(--accent); box-shadow: var(--bloom); }
        .minimized-indicator { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; position: absolute; bottom: -8px; }

        /* Command Palette */
        #command-palette { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); display: none; justify-content: center; padding-top: 15vh; z-index: 10000; }
        .cmd-container { width: 100%; max-width: 600px; background: var(--bg-glass); border: 1px solid var(--accent); border-radius: 16px; box-shadow: var(--bloom); }
        #cmd-input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 1.5rem; padding: 20px; font-family: inherit; border-bottom: 1px solid var(--border-glass);}
    </style>
</head>
<body>

    <div id="apex-background-container">
        <div id="image-bg"></div>
        <video id="video-bg" autoplay loop muted playsinline></video>
        <div id="bg-overlay"></div>
    </div>

    <!-- 1. BOOT SCREEN -->
    <div id="boot-screen">
        <video id="boot-video" autoplay loop muted playsinline>
            <source src="https://files.catbox.moe/5xh10y.mp4" type="video/mp4">
        </video>
        <div class="loader-container"><div id="loader-progress"></div></div>
    </div>

    <!-- 2. AUTH GATEWAY -->
    <div id="auth-screen" style="visibility: hidden; opacity: 0;">
        <div class="auth-panel">
            <h2>NEXUS GATEWAY</h2>
            <input type="email" id="auth-email" class="auth-input" placeholder="Neural ID (Email)">
            <input type="password" id="auth-pass" class="auth-input" placeholder="Access Code (Password)">
            <button class="auth-btn" onclick="NexusCloud.login()">INITIALIZE UPLINK</button>
            <button class="auth-btn auth-btn-ghost" onclick="NexusCloud.signup()">REGISTER NEW ENTITY</button>
            <div style="margin-top: 15px; font-size: 11px;">
                <a href="#" style="color: var(--border-glass);" onclick="bootOS(true)">Skip / Enter Guest Mode</a>
            </div>
            <div id="auth-error" style="color: #ff3366; font-size: 12px; margin-top: 10px;"></div>
        </div>
    </div>

    <!-- Command Palette -->
    <div id="command-palette" onclick="if(event.target === this) toggleCommandPalette()">
        <div class="cmd-container">
            <input type="text" id="cmd-input" placeholder="⚡ Search Command, App, or URL..." autocomplete="off">
        </div>
    </div>

    <!-- OS UI -->
    <header id="system-header">
        <div class="meta-row">
            <div class="meta-item">ARCHIVE: <span id="cur-date">--/--/--</span></div>
            <div class="meta-item">CHRONO: <span id="cur-time">00:00:00</span></div>
            <div class="meta-item">UPLINK: <span id="cur-traffic">VERIFYING...</span></div>
        </div>
        <div class="header-actions">
            <div class="header-search">
                <input type="text" placeholder="Cmd+K to Command..." readonly onclick="toggleCommandPalette()">
            </div>
            <button id="auth-status-btn" onclick="NexusCloud.logout()">LOGOUT</button>
        </div>
    </header>

    <div id="desktop-app-grid"></div>

    <div id="right-hud">
        <div class="hud-panel">
            <div class="status-row"><span>ENVIRONMENT</span><span id="active-mode-display" class="glow-text">ARTEMIS</span></div>
            <div class="mode-grid">
                <button class="mode-btn" onclick="switchMode('ARTEMIS')">Ω</button>
                <button class="mode-btn" onclick="switchMode('APPLE')"></button>
                <button class="mode-btn" onclick="switchMode('LINUX')">🐧</button>
                <button class="mode-btn" onclick="switchMode('MICROSOFT')">⊞</button>
            </div>
        </div>

        <div class="hud-panel">
            <div class="status-row"><span class="glow-text">HERITAGE BOOKMARKS</span><span>★</span></div>
            <div class="bookmark-list" id="bookmarks-container">
                <div style="color: #666; font-size: 10px;">No active links.</div>
            </div>
        </div>
    </div>

    <div id="desktop-manager"></div>
    <div class="bottom-dock" id="bottom-dock"><div id="minimized-container" style="display:flex; gap:15px;"></div></div>

<script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'https://jgewbtftolyxyctpsviy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnZXdidGZ0b2x5eHljdHBzdml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTUxNjgsImV4cCI6MjEwMTc5MTE2OH0.gALvtvDMdKDT0tvbWqygjR2311Q_JztEr18PPIPzM4A';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- OS STATE ---
    let currentUser = null;
    let isGuest = false;
    let threads = {}; 
    let highestZ = 200;
    let saveTimeout = null;

    const systems = {
        ARTEMIS: { color: "#00f2ff", font: "'Courier New', monospace", bg: "https://cdn.pixabay.com/video/2023/10/20/185834-876615024_tiny.mp4" },
        APPLE: { color: "#ffffff", font: "-apple-system, sans-serif", bg: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop" },
        LINUX: { color: "#39ff14", font: "monospace", bg: "https://cdn.pixabay.com/video/2021/08/20/85732-590457611_tiny.mp4" },
        MICROSOFT: { color: "#00a4ef", font: "'Segoe UI', sans-serif", bg: "https://images.unsplash.com/photo-1635326445090-67f139618175?q=80&w=2070&auto=format&fit=crop" }
    };

    const apps = [
        { name: "NEXUS HUB", url: "https://artemis-hub.vercel.app/", icon: "🧬" },
        { name: "ARCHITECT", url: "https://architect-artemis.vercel.app/", icon: "📐" },
        { name: "AETHERIS", url: "https://aetheris-business-model.vercel.app/", icon: "🔱" },
        { name: "TRACKER", url: "https://olympus-aetheris.vercel.app/", icon: "🛰️" },
        { name: "STARBLOOD", url: "https://starblood.vercel.app/", icon: "🩸" }
    ];

    // --- BOOT SEQUENCE ---
    window.addEventListener('load', async () => {
        document.getElementById('loader-progress').style.width = '100%';
        
        // Check active session immediately
        const { data: { session } } = await supabaseClient.auth.getSession();
        currentUser = session?.user || null;

        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                if (currentUser) bootOS(false);
                else {
                    const authScr = document.getElementById('auth-screen');
                    authScr.style.visibility = 'visible';
                    authScr.style.opacity = '1';
                }
            }, 1000);
        }, 2000);
    });

    async function bootOS(guestMode = false) {
        isGuest = guestMode;
        document.getElementById('auth-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('auth-screen').style.display = 'none', 1000);

        const statusEl = document.getElementById('cur-traffic');
        const userBtn = document.getElementById('auth-status-btn');
        
        if (isGuest) {
            statusEl.innerText = "LOCAL GUEST MODE";
            statusEl.style.color = "#ffbd2e";
            userBtn.innerText = "LOGIN";
        } else {
            statusEl.innerText = "SUPABASE SECURED";
            statusEl.style.color = "#39ff14";
            statusEl.style.textShadow = "0 0 10px #39ff14";
            userBtn.innerText = "LOGOUT";
        }

        renderDesktopApps();
        await NexusCloud.loadBookmarks();
        await NexusCloud.restoreSessionState();

        setInterval(() => {
            const now = new Date();
            document.getElementById('cur-date').innerText = now.toLocaleDateString();
            document.getElementById('cur-time').innerText = now.toLocaleTimeString();
        }, 1000);
    }

    // --- NEXUS CLOUD ENGINE (Auth, Save States, Bookmarks) ---
    const NexusCloud = {
        async login() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) document.getElementById('auth-error').innerText = error.message;
            else { currentUser = data.user; bootOS(false); }
        },
        async signup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) document.getElementById('auth-error').innerText = error.message;
            else document.getElementById('auth-error').innerText = "Entity Registered. Please Log In.";
        },
        async logout() {
            if (isGuest) return location.reload(); // If guest, just refresh to go to login screen
            await supabaseClient.auth.signOut();
            location.reload();
        },

        // --- SAVE STATES ---
        triggerSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => this.saveSessionState(), 1000); // Debounce saves
        },
        async saveSessionState() {
            // Build layout state payload
            const statePayload = {};
            Object.keys(threads).forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    statePayload[id] = {
                        ...threads[id],
                        x: el.style.left || '100px',
                        y: el.style.top || '100px',
                        w: el.style.width || '900px',
                        h: el.style.height || '600px'
                    };
                }
            });

            if (isGuest) {
                localStorage.setItem('apex_session', JSON.stringify(statePayload));
            } else if (currentUser) {
                await supabaseClient.from('apex_sessions').upsert({ user_id: currentUser.id, session_data: statePayload });
            }
        },
        async restoreSessionState() {
            let savedState = null;
            if (isGuest) {
                savedState = JSON.parse(localStorage.getItem('apex_session'));
            } else if (currentUser) {
                const { data } = await supabaseClient.from('apex_sessions').select('session_data').eq('user_id', currentUser.id).single();
                if (data) savedState = data.session_data;
            }

            // Fallback mode if no save state exists
            const mode = localStorage.getItem('artemis-mode') || 'ARTEMIS';
            switchMode(mode);

            if (savedState && Object.keys(savedState).length > 0) {
                Object.keys(savedState).forEach(id => {
                    const w = savedState[id];
                    spawnFrame(w.url, w.name, w.icon, id, w.x, w.y, w.w, w.h, w.minimized, false);
                });
            } else {
                // First boot default apps
                spawnFrame('https://artemis-hub.vercel.app/', 'NEXUS HUB', '🧬');
            }
        },

        // --- BOOKMARKS ---
        async toggleBookmark(name, url, icon) {
            if (isGuest) {
                let bms = JSON.parse(localStorage.getItem('apex_bookmarks') || "[]");
                if(!bms.some(b => b.app_url === url)) {
                    bms.push({ app_name: name, app_url: url, icon });
                    localStorage.setItem('apex_bookmarks', JSON.stringify(bms));
                }
            } else if (currentUser) {
                await supabaseClient.from('apex_bookmarks').insert([{ user_id: currentUser.id, app_name: name, app_url: url, icon }]);
            }
            this.loadBookmarks();
        },
        async loadBookmarks() {
            let bms = [];
            if (isGuest) {
                bms = JSON.parse(localStorage.getItem('apex_bookmarks') || "[]");
            } else if (currentUser) {
                const { data } = await supabaseClient.from('apex_bookmarks').select('*').order('created_at', { ascending: false });
                if (data) bms = data;
            }
            
            const cont = document.getElementById('bookmarks-container');
            cont.innerHTML = '';
            if(bms.length === 0) { cont.innerHTML = '<div style="color:#666; font-size:10px;">No active links.</div>'; return; }
            
            bms.forEach(b => {
                const el = document.createElement('div');
                el.className = 'bookmark-item';
                el.innerHTML = `<span>${b.icon}</span> <span>${b.app_name}</span>`;
                el.onclick = () => spawnFrame(b.app_url, b.app_name, b.icon);
                cont.appendChild(el);
            });
        }
    };

    // --- WINDOW MANAGEMENT ---
    function spawnFrame(url, name, icon, forceId=null, forceX=null, forceY=null, forceW=null, forceH=null, forceMin=false, triggerCloud=true) {
        const id = forceId || ('win-' + Date.now());
        if (threads[id]) return focusWindow(id); // Prevent dupes

        let finalUrl = url.includes('google.com/search') && !url.includes('igu=1') ? url + '&igu=1' : url;
        const offset = (Object.keys(threads).length % 5) * 30;
        
        const x = forceX || `${100 + offset}px`;
        const y = forceY || `${100 + offset}px`;
        const w = forceW || `900px`;
        const h = forceH || `600px`;
        const display = forceMin ? 'none' : 'flex';

        const markup = `
            <div class="holoframe" id="${id}" style="top:${y}; left:${x}; width:${w}; height:${h}; display:${display};" onmousedown="focusWindow('${id}')">
                <div class="holo-header" id="header-${id}">
                    <div class="action-btns">
                        <button class="win-btn btn-close" onclick="closeWindow('${id}')">x</button>
                        <button class="win-btn btn-min" onclick="minimizeWindow('${id}')">-</button>
                        <button class="win-btn btn-max" onclick="toggleMaximize('${id}')">+</button>
                        <button class="win-btn btn-star" onclick="NexusCloud.toggleBookmark('${name}', '${finalUrl}', '${icon}')">★</button>
                    </div>
                    <div class="window-title">${icon} ${name}</div>
                    <input type="text" class="internal-address-bar" id="addr-${id}" value="${finalUrl}" onkeypress="if(event.key==='Enter') navigateInternal('${id}')">
                </div>
                <div class="iframe-wrapper">
                    <div class="drag-shield" id="shield-${id}"></div>
                    <iframe id="iframe-${id}" src="${finalUrl}"></iframe>
                </div>
            </div>`;
        
        document.getElementById('desktop-manager').insertAdjacentHTML('beforeend', markup);
        threads[id] = { name, icon, url: finalUrl, minimized: forceMin };
        
        makeDraggable(id);
        if(!forceMin) focusWindow(id);
        updateDock();
        
        if (triggerCloud) NexusCloud.triggerSave();
    }

    function focusWindow(id) {
        if (document.getElementById(id)) document.getElementById(id).style.zIndex = ++highestZ;
    }
    function toggleMaximize(id) {
        document.getElementById(id).classList.toggle('maximized');
        NexusCloud.triggerSave();
    }
    function closeWindow(id) {
        document.getElementById(id)?.remove();
        delete threads[id];
        updateDock();
        NexusCloud.triggerSave();
    }
    function minimizeWindow(id) {
        document.getElementById(id).style.display = 'none';
        threads[id].minimized = true;
        updateDock();
        NexusCloud.triggerSave();
    }
    function restoreWindow(id) {
        document.getElementById(id).style.display = 'flex';
        threads[id].minimized = false;
        focusWindow(id);
        updateDock();
        NexusCloud.triggerSave();
    }
    function updateDock() {
        const container = document.getElementById('minimized-container');
        container.innerHTML = '';
        Object.keys(threads).forEach(id => {
            if (threads[id].minimized) {
                const btn = document.createElement('div');
                btn.className = 'dock-app';
                btn.title = threads[id].name;
                btn.innerHTML = `${threads[id].icon} <div class="minimized-indicator"></div>`;
                btn.onclick = () => restoreWindow(id);
                container.appendChild(btn);
            }
        });
    }

    function makeDraggable(id) {
        const el = document.getElementById(id);
        const header = document.getElementById(`header-${id}`);
        const shield = document.getElementById(`shield-${id}`);
        let isDragging = false, startX, startY, initX, initY;

        header.onmousedown = (e) => {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || el.classList.contains('maximized')) return;
            isDragging = true; shield.style.display = 'block';
            startX = e.clientX; startY = e.clientY; initX = el.offsetLeft; initY = el.offsetTop;
        };
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            el.style.left = `${initX + (e.clientX - startX)}px`;
            el.style.top = `${initY + (e.clientY - startY)}px`;
        });
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false; shield.style.display = 'none';
                NexusCloud.triggerSave(); // Save new position
            }
        });

        // Save state on resize completion
        const observer = new ResizeObserver(() => NexusCloud.triggerSave());
        observer.observe(el);
    }

    // --- UI HELPERS ---
    function switchMode(modeName) {
        const config = systems[modeName];
        if (!config) return;
        document.documentElement.style.setProperty('--accent', config.color);
        document.documentElement.style.setProperty('--accent-glow', config.color + '80'); 
        document.documentElement.style.setProperty('--font-main', config.font);
        document.getElementById('active-mode-display').innerText = modeName;
        
        const videoEl = document.getElementById('video-bg'), imageEl = document.getElementById('image-bg');
        if (/\.(mp4|webm|ogg)$/i.test(config.bg)) {
            imageEl.style.opacity = '0'; videoEl.src = config.bg; videoEl.style.opacity = '1';
        } else {
            videoEl.style.opacity = '0'; imageEl.style.backgroundImage = `url(${config.bg})`; imageEl.style.opacity = '1';
        }
        localStorage.setItem('artemis-mode', modeName);
    }
    
    function renderDesktopApps() {
        const grid = document.getElementById('desktop-app-grid');
        grid.innerHTML = '';
        apps.forEach(app => {
            const el = document.createElement('div'); el.className = 'app-icon';
            el.innerHTML = `<div class="icon-box">${app.icon}</div><div class="app-label">${app.name}</div>`;
            el.onclick = () => spawnFrame(app.url, app.name, app.icon);
            grid.appendChild(el);
        });
    }

    function toggleCommandPalette() {
        const p = document.getElementById('command-palette'), i = document.getElementById('cmd-input');
        if (p.style.display === 'flex') p.style.display = 'none';
        else { p.style.display = 'flex'; i.value = ''; i.focus(); }
    }
    document.getElementById('cmd-input').addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && e.target.value.trim()) {
            spawnFrame(`https://www.google.com/search?q=${encodeURIComponent(e.target.value)}&igu=1`, `Search: ${e.target.value}`, '🔍');
            toggleCommandPalette();
        }
    });

</script>
</body>
</html>
