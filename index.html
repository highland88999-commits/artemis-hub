<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>ARTEMIS • NEXUS HUB 100</title>
    <style>
        :root { 
            --cyan: #00f2ff; 
            --bg: #000; 
            --glass: rgba(0, 15, 25, 0.85); 
            --border: rgba(0, 242, 255, 0.3);
            --neon-glow: 0 0 15px rgba(0, 242, 255, 0.6);
            --bloom: 0 0 20px rgba(0, 242, 255, 0.4);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: var(--bg); font-family: 'Courier New', monospace; color: var(--cyan); }

        #bg-video {
            position: fixed; inset: 0; width: 100%; height: 100%;
            z-index: -2; object-fit: cover; filter: brightness(0.4) contrast(1.1);
        }
        body::after {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.85) 100%);
            z-index: -1; pointer-events: none;
        }

        .header-nav { 
            padding: 15px; border-bottom: 1px solid var(--border); 
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            display: flex; gap: 10px; position: relative; z-index: 1000;
        }
        #browser-input { 
            flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--cyan); 
            padding: 12px; color: var(--cyan); font-size: 1rem; outline: none; 
            box-shadow: var(--neon-glow); text-align: center;
        }

        .nexus-viewport { 
            height: calc(100vh - 160px); display: flex; overflow-x: auto; 
            scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth;
        }
        .nexus-viewport::-webkit-scrollbar { display: none; }

        .sector-page { min-width: 100%; height: 100%; padding: 40px; scroll-snap-align: start; overflow-y: auto; }
        .sector-title { font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 20px; text-shadow: var(--bloom); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .node { 
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border); padding: 15px; 
            text-align: center; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .node:hover { background: var(--cyan); color: #000; box-shadow: var(--neon-glow); transform: scale(1.05); }

        #window-manager { position: fixed; inset: 0; pointer-events: none; z-index: 2000; }
        .holoframe {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 75%;
            background: var(--glass); border: 2px solid var(--cyan);
            backdrop-filter: blur(25px); border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            display: flex; flex-direction: column; pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .holoframe.minimized { transform: scale(0.3) translate(80vw, 80vh); opacity: 0.6; pointer-events: none; }
        
        .holo-header {
            padding: 10px 15px; background: rgba(0, 242, 255, 0.1);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; cursor: move; font-weight: bold; font-size: 12px;
        }
        .holo-controls { display: flex; gap: 12px; }
        .ctrl-btn { cursor: pointer; padding: 2px 8px; border: 1px solid var(--border); border-radius: 3px; }
        .ctrl-btn:hover { background: var(--cyan); color: #000; }
        
        .holo-body { flex: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        .thread-dock {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0, 0, 0, 0.9); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 10px;
            overflow-x: auto; z-index: 3000; backdrop-filter: blur(15px);
        }
        .dock-tab {
            padding: 8px 15px; background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--border); border-radius: 4px;
            font-size: 10px; cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .dock-tab:hover { background: rgba(0, 242, 255, 0.3); }
        .dock-tab.active { border-color: #fff; box-shadow: var(--bloom); background: var(--cyan); color: #000; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
    </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline>
    <source src="https://raw.githubusercontent.com/highland88999-commits/artemis-hub/main/No_humans_pleas%20(1).mp4" type="video/mp4">
</video>

<div class="header-nav">
    <input type="text" id="browser-input" placeholder="EXECUTE NEURAL COMMAND (URL OR SEARCH)...">
    <button class="ctrl-btn" onclick="neuralRandomizer()">RANDOM</button>
</div>

<div class="nexus-viewport" id="viewport"></div>

<div id="window-manager"></div>

<div class="thread-dock" id="thread-dock"></div>

<script>
    const PROXY = "https://artemis-proxy.onrender.com/";
    const viewport = document.getElementById('viewport');
    const windowManager = document.getElementById('window-manager');
    const threadDock = document.getElementById('thread-dock');
    
    let activeThreads = [];
    let zIndexCounter = 2000;

    // Full 100-site data (abbreviated here – paste your complete object)
    const data = {
        "INTEL": [
            { name: "Wikipedia", url: "wikipedia.org" }, { name: "WolframAlpha", url: "wolframalpha.com" },
            { name: "Archive.org", url: "archive.org" }, { name: "Britannica", url: "britannica.com" },
            // ... add all your sites
        ],
        // ... rest of categories
    };

    function transmit(url, name) {
        let target = url.startsWith('http') ? url : `https://${url}`;
        if (target.includes("google.com")) {
            target += (target.includes('?') ? '&' : '?') + 'igu=1';
        }
        spawnWindow(PROXY + target, name);
    }

    function spawnWindow(url, name) {
        const id = 'thread-' + Date.now();
        const winMarkup = `
            <div class="holoframe" id="${id}" style="z-index: ${++zIndexCounter}">
                <div class="holo-header">
                    <span>${name.toUpperCase()}</span>
                    <div class="holo-controls">
                        <span class="ctrl-btn" onclick="toggleMinimize('${id}')">[_]</span>
                        <span class="ctrl-btn" onclick="closeThread('${id}')" style="color: #ff3366;">[X]</span>
                    </div>
                </div>
                <div class="holo-body">
                    <iframe src="${url}" onerror="this.srcdoc='<body style=\'margin:0;padding:40px;background:#000;color:#ff3366;font-family:monospace;text-align:center;\'><h2>ACCESS DENIED</h2><p>Proxy or site blocked.</p></body>'"></iframe>
                </div>
            </div>`;
        
        windowManager.insertAdjacentHTML('beforeend', winMarkup);
        
        const threadObj = { id, name: name.toUpperCase() };
        activeThreads.push(threadObj);
        updateDock();
        makeDraggable(document.getElementById(id));
    }

    function toggleMinimize(id) {
        const win = document.getElementById(id);
        win.classList.toggle('minimized');
        if (!win.classList.contains('minimized')) {
            win.style.zIndex = ++zIndexCounter;
        }
        updateDock();
    }

    function closeThread(id) {
        document.getElementById(id).remove();
        activeThreads = activeThreads.filter(t => t.id !== id);
        updateDock();
    }

    function updateDock() {
        threadDock.innerHTML = '';
        activeThreads.forEach(t => {
            const win = document.getElementById(t.id);
            const isMinimized = win.classList.contains('minimized');
            const tab = document.createElement('div');
            tab.className = `dock-tab ${!isMinimized ? 'active' : ''}`;
            tab.innerText = t.name;
            tab.onclick = () => {
                if (isMinimized) toggleMinimize(t.id);
                else win.style.zIndex = ++zIndexCounter;
                updateDock();
            };
            threadDock.appendChild(tab);
        });
    }

    function makeDraggable(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        const header = el.querySelector(".holo-header");
        header.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            el.style.zIndex = ++zIndexCounter;
            updateDock();
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            el.style.top = (el.offsetTop - pos2) + "px";
            el.style.left = (el.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    // Initialize sectors
    Object.keys(data).forEach((sector, index) => {
        const page = document.createElement('div');
        page.className = 'sector-page';
        page.innerHTML = `<div class="sector-title">${sector}</div>`;
        const grid = document.createElement('div');
        grid.className = 'grid';
        data[sector].forEach(site => {
            const node = document.createElement('div');
            node.className = 'node';
            node.innerHTML = `<span>${site.name}</span><small>${site.url}</small>`;
            node.onclick = () => transmit(site.url, site.name);
            grid.appendChild(node);
        });
        page.appendChild(grid);
        viewport.appendChild(page);

        // Dots
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => viewport.scrollTo({ left: viewport.offsetWidth * index, behavior: 'smooth' });
        document.getElementById('dots').appendChild(dot);  // Add <div id="dots" class="nav-dots"></div> in HTML if missing
    });

    viewport.addEventListener('scroll', () => {
        const index = Math.round(viewport.scrollLeft / viewport.offsetWidth);
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
    });

    document.getElementById('browser-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = e.target.value.trim();
            if (val) {
                if (val.includes('.') && !val.includes(' ')) transmit(val, val);
                else transmit(`https://www.google.com/search?q=${encodeURIComponent(val)}`, "SEARCH");
                e.target.value = '';
            }
        }
    });

    function neuralRandomizer() {
        const allSites = Object.values(data).flat();
        const res = allSites[Math.floor(Math.random() * allSites.length)];
        transmit(res.url, res.name);
    }
</script>
</body>
</html>
